<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f54b17" />
    <title>App Download</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />


  </head>
  <body>
    <main class="app-page">
      <section class="download-card" aria-labelledby="app-name">
        <div class="trending-badge" aria-label="Most trending app">
          <span aria-hidden="true">♨</span> MOST TRENDING APP
        </div>

        <div class="brand-mark" id="brand-mark" aria-label="App brand"></div>

        <h1 id="app-name"></h1>
        <p class="intro" id="app-description"></p>

        <a class="download-button" id="download-button" href="#" download>
          <span aria-hidden="true">⬇</span>
          <span>DOWNLOAD APK</span>
        </a>

        <ul class="features" aria-label="App benefits">
          <li>
            <span class="feature-icon" aria-hidden="true">⚡</span>
            <div><h2>Fast Results</h2><p>Instant updates without delay.</p></div>
          </li>
          <li>
            <span class="feature-icon" aria-hidden="true">🔒</span>
            <div><h2>Secure App</h2><p>Your data stays protected.</p></div>
          </li>
          <li>
            <span class="feature-icon" aria-hidden="true">📱</span>
            <div><h2>Mobile Friendly</h2><p>Smooth on all Android phones.</p></div>
          </li>
        </ul>

        <p class="official-note"><span aria-hidden="true">✓</span> Official APK <span aria-hidden="true">•</span> <span aria-hidden="true">✓</span> Android Only</p>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
